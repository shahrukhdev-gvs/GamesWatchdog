# Dark "game studio" theme. Streamlit applies this to every built-in widget
# (tables, selectboxes, popovers, checkboxes); theme.py adds the custom styling.
[theme]
base = "dark"
primaryColor = "#ff2e88"
backgroundColor = "#06050d"
secondaryBackgroundColor = "#15122e"
textColor = "#ecebff"
linkColor = "#22e4ff"
borderColor = "#2c2554"
baseRadius = "10px"
