name: Play Store Watchdog Monitor

on:
  # No GitHub `schedule:` on purpose. Supabase pg_cron starts this workflow
  # every 2 hours at :17 UTC through the GitHub API (job "monitor-watchlist",
  # calling private.dispatch_monitor('monitor.yml')). GitHub's own scheduler
  # dropped or delayed most runs. You can also start it from the Actions tab.
  workflow_dispatch: {}

# Never let two watchlist runs overlap; a second one waits for the first.
concurrency:
  group: monitor-watchlist
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python monitor.py