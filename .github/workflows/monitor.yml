name: Play Store Watchdog Monitor

on:
  schedule:
    # Every 2 hours at :17. GitHub drops or delays many scheduled runs that
    # land on the top of the hour, so this is deliberately off the hour.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python monitor.py