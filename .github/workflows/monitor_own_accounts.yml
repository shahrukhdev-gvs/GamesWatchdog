name: Play Store Watchdog - My Accounts Monitor

on:
  schedule:
    # Every 30 minutes, at :07 and :37 (off the hour: GitHub drops or delays
    # many scheduled runs that land on :00 / :30).
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

jobs:
  monitor_own:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run own accounts monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python monitor_own_accounts.py