name: Play Store Watchdog - My Accounts Monitor

on:
  # No GitHub `schedule:` on purpose. Supabase pg_cron starts this workflow
  # every 30 minutes at :07 and :37 UTC through the GitHub API (job
  # "monitor-own-accounts", calling private.dispatch_monitor('monitor_own_accounts.yml')).
  # GitHub's own scheduler dropped or delayed most runs. You can also start it
  # from the Actions tab.
  workflow_dispatch: {}

# Never let two own-accounts runs overlap; a second one waits for the first.
concurrency:
  group: monitor-own-accounts
  cancel-in-progress: false

jobs:
  monitor_own:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run own accounts monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python monitor_own_accounts.py